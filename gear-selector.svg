<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-label="6-speed H-gate gear selector with reverse">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#191f30" />
      <stop offset="100%" stop-color="#0a0f1c" />
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.92" />
      <stop offset="100%" stop-color="#fff" stop-opacity="0.72" />
    </linearGradient>
  </defs>
  <rect width="800" height="420" rx="40" fill="#11161f" />
  <rect x="30" y="30" width="740" height="360" rx="32" fill="url(#bg)" stroke="#4a5a7a" stroke-width="6" />
  <g stroke="url(#line)" stroke-width="16" stroke-linecap="round">
    <path d="M 220 70 L 220 350" />
    <path d="M 420 70 L 420 350" />
    <path d="M 620 70 L 620 350" />
    <path d="M 220 210 L 760 210" />
  </g>
  <text x="160" y="140" fill="#fff" font-family="Inter, sans-serif" font-size="78" font-weight="700" text-anchor="middle">R</text>
  <text x="340" y="140" fill="#fff" font-family="Inter, sans-serif" font-size="78" font-weight="700" text-anchor="middle">1</text>
  <text x="540" y="140" fill="#fff" font-family="Inter, sans-serif" font-size="78" font-weight="700" text-anchor="middle">3</text>
  <text x="740" y="140" fill="#fff" font-family="Inter, sans-serif" font-size="78" font-weight="700" text-anchor="middle">5</text>
  <text x="340" y="320" fill="#fff" font-family="Inter, sans-serif" font-size="78" font-weight="700" text-anchor="middle">2</text>
  <text x="540" y="320" fill="#fff" font-family="Inter, sans-serif" font-size="78" font-weight="700" text-anchor="middle">4</text>
  <text x="740" y="320" fill="#fff" font-family="Inter, sans-serif" font-size="78" font-weight="700" text-anchor="middle">6</text>
</svg>
